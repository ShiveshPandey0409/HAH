services:
  - type: web
    name: hah-api-prava
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/ShiveshPandey0409/HAH
    branch: shivesh
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run python -m app.db.bootstrap && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hah-postgres
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MCP_PUBLIC_URL
        value: https://hah-api-prava.onrender.com/mcp
      - key: MCP_OAUTH_ISSUER_URL
        sync: false
      - key: MCP_OAUTH_INTROSPECTION_URL
        sync: false
      - key: MCP_OAUTH_INTROSPECTION_CLIENT_ID
        sync: false
      - key: MCP_OAUTH_INTROSPECTION_CLIENT_SECRET
        sync: false
      - key: MCP_ALLOWED_HOSTS
        value: '["hah-api-prava.onrender.com"]'
      - key: MCP_ALLOWED_ORIGINS
        value: '["https://hah-api-prava.onrender.com"]'
      - key: WEBHOOK_SECRET_ENCRYPTION_KEYS
        sync: false
      - key: WEBHOOK_WORKER_ENABLED
        value: "true"
      - key: PRAVA_PAYMENT_AUTOMATION_ENABLED
        value: "true"
      - key: PRAVA_PAYMENT_WORKER_ENABLED
        value: "true"
      - key: PRAVA_BASE_URL
        value: https://sandbox.api.prava.space
      - key: PRAVA_SECRET_KEY
        sync: false
      - key: PRAVA_PAYER_USER_ID
        value: hah-universal-hackathon-payer
      - key: PRAVA_PAYER_EMAIL
        sync: false
      - key: PRAVA_MERCHANT_NAME
        value: Hire a Human
      - key: PRAVA_MERCHANT_URL
        value: https://hah-api-prava.onrender.com
      - key: PRAVA_MERCHANT_COUNTRY
        value: IN
      - key: PRAVA_SETTLEMENT_MODE
        value: prava_sandbox
      - key: HTTP_SESSION_TTL_SECONDS
        value: "604800"
      - key: PASSWORD_RESET_TTL_SECONDS
        value: "900"
      - key: PASSWORD_RESET_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

databases:
  - name: hah-postgres
    databaseName: hah
    user: hah
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
